<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>scene-director</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        color: #cfd8e6;
        font:
          13px/1.4 system-ui,
          sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 420px;
        padding: 10px 12px;
        background: rgba(8, 12, 20, 0.78);
        border: 1px solid rgba(120, 150, 190, 0.25);
        border-radius: 6px;
        pointer-events: none;
      }
      #overlay h1 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #8fb4e8;
      }
      #overlay dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
      }
      #overlay dt {
        color: #7d8ba0;
      }
      #overlay dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #overlay ul {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        max-height: 45vh;
        overflow-y: auto;
        pointer-events: auto;
      }
      #overlay button.follow {
        margin-right: 4px;
        padding: 0 6px;
        font: inherit;
        font-size: 11px;
        color: #8fb4e8;
        background: rgba(40, 60, 90, 0.6);
        border: 1px solid rgba(120, 150, 190, 0.35);
        border-radius: 3px;
        cursor: pointer;
      }
      #overlay button.follow.on {
        color: #05070c;
        background: #8fb4e8;
      }
      #overlay li span {
        color: #7d8ba0;
      }
      #overlay li.ready span,
      #overlay li.validated span {
        color: #6fcf8f;
      }
      #overlay li.failed span,
      #overlay .error {
        color: #f08a8a;
      }
      #overlay .hint {
        margin: 8px 0 0;
        color: #5f6c80;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
